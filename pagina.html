<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi bolsa de golf</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #0f3d2e; --verde2: #17583f; --cesped: #3fa66b;
    --crema: #f4efe3; --oro: #d9b44a; --texto: #f4efe3; --suave: #a9c2b3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: Inter, sans-serif; color: var(--texto);
    background: radial-gradient(circle at 20% 0%, var(--verde2), var(--verde) 60%);
    padding: 40px 20px;
  }
  .caja { max-width: 820px; margin: 0 auto; }
  h1 { font-family: Fraunces, serif; font-size: 44px; margin: 0; letter-spacing: -1px; }
  .sub { color: var(--suave); margin: 6px 0 28px; }

  .escenarios { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .escenarios button {
    border: 1px solid rgba(244,239,227,.25); background: transparent; color: var(--texto);
    padding: 10px 16px; border-radius: 999px; cursor: pointer; font: 600 14px Inter;
    transition: all .2s;
  }
  .escenarios button:hover { border-color: var(--oro); }
  .escenarios button.activo { background: var(--oro); color: var(--verde); border-color: var(--oro); }

  .buscador { background: rgba(0,0,0,.18); padding: 20px; border-radius: 16px; margin-bottom: 28px; }
  .controles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .controles label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--suave); margin-bottom: 6px; }
  .controles input, .controles select {
    width: 100%; padding: 11px 12px; font: 600 16px Inter; border-radius: 10px;
    border: none; background: var(--crema); color: var(--verde);
  }
  .resultado { margin-top: 18px; min-height: 30px; }
  .respuesta { font-family: Fraunces, serif; font-size: 28px; color: var(--oro); }
  .detalle { color: var(--suave); font-size: 14px; margin-top: 4px; }

  .palo { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: 14px; margin: 10px 0; }
  .nombre { font-weight: 600; }
  .pista { height: 26px; background: rgba(0,0,0,.2); border-radius: 13px; overflow: hidden; }
  .barra {
    height: 100%; width: 0; border-radius: 13px;
    background: linear-gradient(90deg, var(--cesped), #7fd39b);
    transition: width .7s cubic-bezier(.2,.8,.2,1), background .3s;
    position: relative;
  }
  .barra::after {
    content: ""; position: absolute; right: 4px; top: 4px; width: 18px; height: 18px;
    border-radius: 50%; background: white; box-shadow: inset -3px -3px 0 rgba(0,0,0,.12);
  }
  .metros { font-family: Fraunces, serif; font-size: 22px; text-align: right; }
  .palo.elegido .barra { background: linear-gradient(90deg, #c99a2e, var(--oro)); }
  .palo.elegido .nombre, .palo.elegido .metros { color: var(--oro); }

  @media (max-width: 600px) {
    h1 { font-size: 32px; }
    .controles { grid-template-columns: 1fr; }
    .palo { grid-template-columns: 80px 1fr 52px; gap: 8px; }
  }
</style>
</head>
<body>
<div class="caja">
  <h1>⛳ Mi bolsa</h1>
  <p class="sub">Distancias en metros según dónde y cuándo juego</p>

  <div class="escenarios" id="escenarios"></div>

  <div class="buscador">
    <div class="controles">
      <div>
        <label>Metros a bandera</label>
        <input type="number" id="objetivo" placeholder="150">
      </div>
      <div>
        <label>Viento</label>
        <select id="viento">
          <option value="sin">Sin viento</option>
          <optgroup label="A favor">
            <option value="favor_poco">A favor · poco</option>
            <option value="favor_medio">A favor · medio</option>
            <option value="favor_mucho">A favor · mucho</option>
          </optgroup>
          <optgroup label="En contra">
            <option value="contra_poco">En contra · poco</option>
            <option value="contra_medio">En contra · medio</option>
            <option value="contra_mucho">En contra · mucho</option>
          </optgroup>
          <optgroup label="De lado">
            <option value="lado_poco">De lado · poco</option>
            <option value="lado_medio">De lado · medio</option>
            <option value="lado_mucho">De lado · mucho</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label>El green está…</label>
        <select id="desnivel">
          <option value="llano">Llano</option>
          <optgroup label="Más alto">
            <option value="arriba_poco">Un poco arriba</option>
            <option value="arriba_medio">Arriba (un piso)</option>
            <option value="arriba_mucho">Muy arriba (dos pisos)</option>
          </optgroup>
          <optgroup label="Más bajo">
            <option value="abajo_poco">Un poco abajo</option>
            <option value="abajo_medio">Abajo (un piso)</option>
            <option value="abajo_mucho">Muy abajo (dos pisos)</option>
          </optgroup>
        </select>
      </div>
    </div>
    <div class="resultado">
      <div class="respuesta" id="respuesta"></div>
      <div class="detalle" id="detalle"></div>
    </div>
  </div>

  <div id="lista"></div>
</div>

<script>
  const ESCENARIOS = {
    mar_verano: "🌊 Mar · Verano",
    mar_invierno: "🌊 Mar · Invierno",
    madrid_verano: "⛰️ Madrid · Verano",
    madrid_invierno: "⛰️ Madrid · Invierno",
  };
  let palos = [];
  let actual = "mar_verano";

  fetch("/palos")
    .then(r => r.json())
    .then(datos => { palos = datos; pintarBotones(); pintar(); });

  function pintarBotones() {
    const caja = document.getElementById("escenarios");
    caja.innerHTML = "";
    for (const [clave, texto] of Object.entries(ESCENARIOS)) {
      const b = document.createElement("button");
      b.textContent = texto;
      if (clave === actual) b.classList.add("activo");
      b.onclick = () => { actual = clave; pintarBotones(); pintar(); };
      caja.appendChild(b);
    }
  }

  function pintar() {
    const max = Math.max(...palos.map(p => p.distancias[actual]));
    document.getElementById("lista").innerHTML = palos.map(p => `
      <div class="palo" data-id="${p.id}">
        <span class="nombre">${p.nombre}</span>
        <div class="pista"><div class="barra" data-ancho="${p.distancias[actual] / max * 100}"></div></div>
        <span class="metros">${p.distancias[actual]}</span>
      </div>`).join("");
    requestAnimationFrame(() => {
      document.querySelectorAll(".barra").forEach(b => b.style.width = b.dataset.ancho + "%");
    });
    buscar();
  }

  // Le preguntamos a la API qué palo usar
  async function buscar() {
    const metros = Number(document.getElementById("objetivo").value);
    const viento = document.getElementById("viento").value;
    const desnivel = document.getElementById("desnivel").value;
    const resp = document.getElementById("respuesta");
    const detalle = document.getElementById("detalle");
    document.querySelectorAll(".palo").forEach(f => f.classList.remove("elegido"));

    if (!metros) { resp.textContent = ""; detalle.textContent = ""; return; }

    const url = `/recomendar?metros=${metros}&escenario=${actual}&viento=${viento}&desnivel=${desnivel}`;
    const datos = await (await fetch(url)).json();

    resp.textContent = "→ " + datos.palo;
    let texto = `Juega como ${datos.juega_como} m · tu ${datos.palo} va a ${datos.distancia_palo} m`;
    if (datos.consejo) texto += " · " + datos.consejo;
    detalle.textContent = texto;

    const fila = document.querySelector(`.palo[data-id="${datos.palo_id}"]`);
    if (fila) fila.classList.add("elegido");
  }

  document.getElementById("objetivo").addEventListener("input", buscar);
  document.getElementById("viento").addEventListener("change", buscar);
  document.getElementById("desnivel").addEventListener("change", buscar);
</script>
</body>
</html>
